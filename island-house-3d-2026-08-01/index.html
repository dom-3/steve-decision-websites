<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Island House — 3D Model</title>
<style>html,body{margin:0;height:100%;background:#0c0d10;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
#meta{position:fixed;top:14px;left:16px;color:#fff;z-index:5;background:rgba(0,0,0,.45);padding:8px 12px;border-radius:10px;font-size:13px}
#meta b{font-size:15px}#hint{position:fixed;bottom:14px;left:16px;color:#cfd3da;font-size:12px;background:rgba(0,0,0,.4);padding:8px 12px;border-radius:10px}
input{vertical-align:middle}</style></head><body>
<div id="meta"><b>ISLAND HOUSE</b> — 3D model · 4,183 points<br>
<label>point size <input id="sz" type="range" min="1" max="6" step="0.5" value="2"></label></div>
<div id="hint">Drag to orbit · scroll to zoom · right-drag to pan</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="points.js"></script>
<script>
const PC=window.PC;
let scene=new THREE.Scene(),camera,renderer,cloud;
let rot={x:-0.3,y:0.6},dist,target=new THREE.Vector3(),down=false,btn=0,px=0,py=0;
function init(){
 const g=new THREE.BufferGeometry();
 g.setAttribute('position',new THREE.BufferAttribute(PC.pos,3));
 g.setAttribute('color',new THREE.BufferAttribute(PC.col,3));
 g.computeBoundingSphere();const bs=g.boundingSphere;target.copy(bs.center);dist=bs.radius*2.2;
 cloud=new THREE.Points(g,new THREE.PointsMaterial({size:2,vertexColors:true,sizeAttenuation:false}));
 scene.add(cloud);
 camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,bs.radius/1000,bs.radius*50);
 renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(devicePixelRatio);renderer.setSize(innerWidth,innerHeight);
 document.body.appendChild(renderer.domElement);const el=renderer.domElement;
 el.addEventListener('contextmenu',e=>e.preventDefault());
 el.addEventListener('pointerdown',e=>{down=true;btn=e.button;px=e.clientX;py=e.clientY;});
 addEventListener('pointerup',()=>down=false);
 addEventListener('pointermove',e=>{if(!down)return;const dx=e.clientX-px,dy=e.clientY-py;px=e.clientX;py=e.clientY;
   if(btn===2){const pan=dist*0.0015;const rt=new THREE.Vector3().crossVectors(camera.up,camera.getWorldDirection(new THREE.Vector3())).normalize();
     target.addScaledVector(rt,dx*pan);target.addScaledVector(camera.up,dy*pan);}
   else{rot.y+=dx*0.005;rot.x+=dy*0.005;rot.x=Math.max(-1.5,Math.min(1.5,rot.x));}});
 el.addEventListener('wheel',e=>{e.preventDefault();dist*=(1+e.deltaY*0.001);},{passive:false});
 addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
 document.getElementById('sz').oninput=e=>cloud.material.size=+e.target.value;
 animate();
}
function animate(){requestAnimationFrame(animate);
 const cx=target.x+dist*Math.cos(rot.x)*Math.sin(rot.y),cy=target.y+dist*Math.sin(rot.x),cz=target.z+dist*Math.cos(rot.x)*Math.cos(rot.y);
 camera.position.set(cx,cy,cz);camera.lookAt(target);renderer.render(scene,camera);}
init();
</script></body></html>
