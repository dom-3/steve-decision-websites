<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Island House — Exterior 3D (drone splat)</title>
<style>
 html,body{margin:0;height:100%;background:#0b0d0a;color:#eee;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;overflow:hidden}
 #bar{position:fixed;top:0;left:0;right:0;height:48px;display:flex;align-items:center;gap:10px;padding:0 14px;background:linear-gradient(#000c,#0000);z-index:20;pointer-events:none}
 #bar b{font-size:14px;letter-spacing:.03em;text-shadow:0 1px 3px #000}
 #bar .tag{font-size:11px;color:#e7b866;border:1px solid #e7b86655;border-radius:6px;padding:2px 8px}
 #hint{position:fixed;left:14px;bottom:14px;background:rgba(0,0,0,.55);border-radius:9px;padding:8px 12px;font-size:12.5px;color:#cbd3c0;z-index:20;line-height:1.4}
 #load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;color:#cbd3c0;z-index:15;background:#0b0d0a}
 #load .big{font-size:15px;color:#e7b866}
 #load small{color:#8fa07d}
 #err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:30px;text-align:center;color:#e6b;z-index:30;background:#0b0d0a;font-size:14px;line-height:1.5}
</style></head><body>
<div id="bar"><b>Island House — Exterior</b> <span class="tag">drone splat · HQ · 2.4M gaussians</span></div>
<div id="hint">Drag to orbit · scroll to zoom · right-drag to pan</div>
<div id="load"><div class="big">Loading the 3D model…</div><small>~58&nbsp;MB · first load takes a few seconds</small></div>
<div id="err"></div>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "@mkkellogg/gaussian-splats-3d": "https://cdn.jsdelivr.net/npm/@mkkellogg/gaussian-splats-3d@0.4.7/build/gaussian-splats-3d.module.js"
}}
</script>
<script type="module">
import * as GaussianSplats3D from '@mkkellogg/gaussian-splats-3d';
try{
  const viewer = new GaussianSplats3D.Viewer({
    cameraUp: [-0.047, 0.727, 0.685],       // true ground-plane normal (model is tilted in COLMAP space)
    initialCameraPosition: [-5.65, 12.06, 2.23],
    initialCameraLookAt: [-0.47, 2.02, 1.56],
    sharedMemoryForWorkers: false,
    dynamicScene: false,
    antialiased: true
  });
  viewer.addSplatScenes([
    { path: 'exterior-a.ply', format: GaussianSplats3D.SceneFormat.Ply, splatAlphaRemovalThreshold: 5 },
    { path: 'exterior-b.ply', format: GaussianSplats3D.SceneFormat.Ply, splatAlphaRemovalThreshold: 5 }
  ], false).then(() => {
    document.getElementById('load').style.display = 'none';
    viewer.start();
  }).catch(e => showErr(e));
}catch(e){ showErr(e); }
function showErr(e){
  document.getElementById('load').style.display='none';
  const d=document.getElementById('err'); d.style.display='flex';
  d.textContent = "Couldn't load the 3D model in this browser. Try Chrome or Safari (latest), or tell Jarvis what it says here: " + (e&&e.message?e.message:e);
  console.error(e);
}
</script>
</body></html>
