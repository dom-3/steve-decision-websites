<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>Island House — Exterior 3D (site model)</title>
<style>
  :root{--bg:#0d0f11;--ink:#f4f1ea;--muted:#a7b0b8;--accent:#c9a15a;--line:#2a3036}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
  #c{position:fixed;inset:0;display:block;width:100vw;height:100vh}
  #meta{position:fixed;top:14px;left:16px;z-index:5;background:rgba(0,0,0,.5);padding:9px 13px;border-radius:10px;font-size:13px;line-height:1.4;max-width:70vw}
  #meta b{color:var(--accent);letter-spacing:.02em}
  #meta small{color:#9aa3ab}
  #hint{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);z-index:5;background:rgba(0,0,0,.5);border:1px solid var(--line);border-radius:999px;padding:8px 15px;font-size:12px;color:var(--muted);display:flex;gap:14px;white-space:nowrap;flex-wrap:wrap;justify-content:center}
  #hint b{color:var(--ink)}
  #spin{position:fixed;top:14px;right:16px;z-index:5;background:rgba(0,0,0,.5);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:7px 12px;font-size:12px;cursor:pointer}
  #load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:8;background:var(--bg);color:#cfd3da;font-size:15px;flex-direction:column;gap:10px}
  .bar{width:240px;height:4px;background:#22262c;border-radius:2px;overflow:hidden}
  .bar>i{display:block;height:100%;width:5%;background:var(--accent);transition:width .2s}
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="meta"><b>ISLAND HOUSE</b> — exterior 3D<br>
  <small>Laugharne · 18 Aug · LiDAR survey · measured, metric scale</small></div>
<button id="spin">Pause spin</button>
<div id="hint"><span><b>Drag</b> to orbit</span><span><b>Scroll / pinch</b> zoom</span><span><b>Right-drag / two-finger</b> pan</span></div>
<div id="load"><div>Loading site model (~17 MB)…</div><div class="bar"><i id="pb"></i></div></div>
<canvas id="c"></canvas>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputColorSpace=THREE.SRGBColorSpace;
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x0d0f11);
const camera=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,0.05,5000);
const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true; controls.dampingFactor=0.08;
controls.screenSpacePanning=true; // right-drag pans in screen space
let autoRotate=true; controls.autoRotate=true; controls.autoRotateSpeed=0.9;

// lighting so matte surfaces read well
scene.add(new THREE.HemisphereLight(0xffffff,0x2a2f36,1.1));
const d1=new THREE.DirectionalLight(0xffffff,1.4); d1.position.set(1,2,1.3); scene.add(d1);
const d2=new THREE.DirectionalLight(0xffffff,0.6); d2.position.set(-1.2,1,-1); scene.add(d2);

function resize(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();}
addEventListener('resize',resize); resize();

const loader=new GLTFLoader();
loader.load('island-house-lidar.glb',(gltf)=>{
  const root=gltf.scene;
  // Polycam materials are metallic=1 (renders black); make them matte & double-sided
  root.traverse(o=>{
    if(o.isMesh && o.material){
      const mats=Array.isArray(o.material)?o.material:[o.material];
      for(const m of mats){ m.metalness=0; m.roughness=1; m.side=THREE.DoubleSide; if(m.map)m.map.colorSpace=THREE.SRGBColorSpace; m.needsUpdate=true; }
    }
  });
  scene.add(root);
  // frame camera on bounds
  const box=new THREE.Box3().setFromObject(root);
  const c=box.getCenter(new THREE.Vector3()), size=box.getSize(new THREE.Vector3());
  const radius=Math.max(size.x,size.y,size.z);
  controls.target.copy(c);
  camera.position.set(c.x+radius*0.75, c.y+radius*0.55, c.z+radius*0.75);
  camera.near=radius/500; camera.far=radius*20; camera.updateProjectionMatrix();
  controls.minDistance=radius*0.08; controls.maxDistance=radius*4;
  controls.update();
  document.getElementById('load').style.display='none';
},(e)=>{ if(e.total){const p=Math.round(e.loaded/e.total*100); const b=document.getElementById('pb'); if(b)b.style.width=Math.max(5,p)+'%';}},
(err)=>{ document.getElementById('load').innerHTML='<div>Could not load the model.<br>'+err+'</div>'; });

const btn=document.getElementById('spin');
btn.onclick=()=>{autoRotate=!autoRotate;controls.autoRotate=autoRotate;btn.textContent=autoRotate?'Pause spin':'Resume spin';};
renderer.domElement.addEventListener('pointerdown',()=>{if(autoRotate){autoRotate=false;controls.autoRotate=false;btn.textContent='Resume spin';}});

(function loop(){requestAnimationFrame(loop);controls.update();renderer.render(scene,camera);})();
</script>
</body>
</html>
