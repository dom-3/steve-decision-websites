<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Island House — Exterior 3D (GPU splat, 1M)</title>
<style>
  html,body{margin:0;height:100%;background:#0b0d10;overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#fff}
  #meta{position:fixed;top:14px;left:16px;z-index:5;background:rgba(0,0,0,.5);
    padding:9px 13px;border-radius:10px;font-size:13px;line-height:1.4;max-width:60vw}
  #meta b{font-size:15px;letter-spacing:.02em;color:#c9a15a}
  #meta small{color:#9aa3ab}
  #hint{position:fixed;bottom:14px;left:16px;z-index:5;background:rgba(0,0,0,.42);
    padding:8px 12px;border-radius:10px;font-size:12px;color:#cfd3da}
  #load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    z-index:8;background:#0b0d10;color:#cfd3da;font-size:15px;flex-direction:column;gap:12px;text-align:center;padding:0 20px}
  .bar{width:240px;height:4px;background:#22262c;border-radius:2px;overflow:hidden}
  .bar>i{display:block;height:100%;width:5%;background:#c9a15a;transition:width .2s}
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "@mkkellogg/gaussian-splats-3d": "https://cdn.jsdelivr.net/npm/@mkkellogg/gaussian-splats-3d@0.4.7/build/gaussian-splats-3d.module.js"
} }
</script>
</head>
<body>
<div id="meta"><b>ISLAND HOUSE</b> — exterior 3D<br>
  <small>drone survey · 17 Aug · GPU build · ~1.0M gaussians · full-res</small><br>
  drag to orbit · scroll to zoom · right-drag to pan</div>
<div id="hint">Gaussian splat (Nerfstudio / A40 GPU) · cleaned &amp; upright</div>
<div id="load"><div>Loading exterior model (~32 MB)…</div><div class="bar"><i id="pbar"></i></div>
  <div style="font-size:12px;color:#8b939b">first load can take a moment</div></div>
<script type="module">
import * as GaussianSplats3D from '@mkkellogg/gaussian-splats-3d';

// Model is Y-up (nerfstudio-oriented), recentred; building rises from y≈0 to y≈10.
const CAM=[5.5, 3.6, 5.5], LOOK=[0, 1.8, 0];

const viewer=new GaussianSplats3D.Viewer({
  cameraUp:[0,1,0],
  initialCameraPosition:CAM,
  initialCameraLookAt:LOOK,
  sphericalHarmonicsDegree:0,
  sharedMemoryForWorkers:false
});
viewer.addSplatScene('exterior-gpu-r2.splat',{
  rotation:[0,0,0,1], position:[0,0,0], scale:[1,1,1],
  splatAlphaRemovalThreshold:5,
  progressiveLoad:false,
  onProgress:(pct)=>{const b=document.getElementById('pbar'); if(b)b.style.width=Math.max(5,pct)+'%';}
}).then(()=>{
  document.getElementById('load').style.display='none';
  viewer.start();
}).catch(e=>{
  document.getElementById('load').innerHTML='<div>Could not load the splat.<br>'+e+
    '<br><br><small>Serve this folder over http (e.g. <code>python3 -m http.server</code>) — file:// blocks the loader.</small></div>';
});
</script>
</body>
</html>
